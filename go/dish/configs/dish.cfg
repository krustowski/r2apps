# dish.cfg
#
# Every setting is a flag name, and a flag given on the command line wins over
# the same setting here.  The file exists because the kernel passes a program
# at most eight arguments, which `-flag value` pairs use up two at a time.
#
#   fg DISH -config /mnt/fat/DISH/DISH.CFG

# Where the list of sockets to check comes from: a file on a mounted
# filesystem, or an http:// URL.
source    = /mnt/fat/DISH/SOCKETS.JSN

# The network.  ip, mask and gw describe this machine; dns is only needed when
# a socket names a host rather than an address.
net       = eth
ip        = 10.3.4.2
mask      = 255.255.255.0
gw        = 10.3.4.1
#dns      = 10.3.4.1

# This instance's name, which is what Pushgateway labels the metric with.
name      = r2-dish
timeout   = 10
verbose   = 1

# Mirror the log to COM1, so a machine with no screen can still be read.
# Not available with net = slip, where COM1 is the wire.
#serialLog = 1

# Where results go.  Only plaintext http:// endpoints can be reached.
#updateURL  = http://10.3.4.1:8080/dish/results
#webhookURL = http://10.3.4.1:8080/dish/webhook
#target     = http://10.3.4.1:9091
#machineNotifySuccess = 1
